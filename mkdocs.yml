site_name: 오멜라스 성서 (Omelasian Bible)
site_url: https://savagemanage.github.io/omelas/

docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: ko
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - tables
  - attr_list

exclude_docs: |
  .agents/
  .git/
  site/

nav:
  - Home: index.md
  - "오멜라스: 요한계시록 (Revelation)":
      - 책 소개: books/01-revelation/00-index.md
      - "제1장: 강남의 복음": books/01-revelation/chapter-01.md
      - "제2장: 영년의 도시": books/01-revelation/chapter-02.md
      - "제3장: 열반의 약속": books/01-revelation/chapter-03.md
      - "제4장: 돌아온 사람": books/01-revelation/chapter-04.md
      - "제5장: 깨어 있는 자": books/01-revelation/chapter-05.md
