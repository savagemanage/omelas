<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap">
  <script>
    /* Anti-flash: apply the stored theme before the stylesheet paints. The
       server renders no data-theme attribute, so light is the default and the
       no-JS fallback (the :root base is the light parchment palette); dark is
       the opt-in override. We only setAttribute when a valid stored value
       exists, so a stored 'dark' applies before paint with no flash, while
       nothing stored leaves the page light. localStorage wrapped in try/catch. */
    (function () {
      try {
        var t = window.localStorage.getItem("omelas-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/omelas.css' | relative_url }}">
</head>
<body>
  {% include header.html %}
  <main class="omelas-main">
    <article class="omelas-article">
      {{ content }}
    </article>
  </main>
  <footer class="omelas-footer">
    <p>오멜라스 성서 · Omelasian Bible</p>
  </footer>
  <script src="{{ '/assets/js/theme-toggle.js' | relative_url }}"></script>
</body>
</html>
