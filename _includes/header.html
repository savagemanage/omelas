<header class="omelas-header">
  <a class="omelas-header__brand" href="{{ '/' | relative_url }}">오멜라스 성서</a>
  <div class="omelas-header__actions">
    {% if page.book %}
    <nav class="omelas-header__nav">
      <a href="{{ '/ko/' | append: page.book | append: '/00-index/' | relative_url }}"
         {% if page.lang == 'ko' %}aria-current="page"{% endif %}>한국어</a>
      <a href="{{ '/en/' | append: page.book | append: '/00-index/' | relative_url }}"
         {% if page.lang == 'en' %}aria-current="page"{% endif %}>English</a>
    </nav>
    {% endif %}
    <button type="button" id="omelas-theme-toggle" class="omelas-theme-toggle"
            aria-label="라이트 모드로 전환 (Switch to light theme)" aria-pressed="false">
      <span class="omelas-theme-toggle__glyph" aria-hidden="true"></span>
    </button>
  </div>
</header>
